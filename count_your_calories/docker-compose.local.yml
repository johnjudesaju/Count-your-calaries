volumes:
  count_your_calories_local_postgres_data: {}
  count_your_calories_local_postgres_data_backups: {}
  count_your_calories_pgadmin_data: {}
  

services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: count_your_calories_local_django
    container_name: count_your_calories_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: count_your_calories_production_postgres
    container_name: count_your_calories_local_postgres
    volumes:
      - count_your_calories_local_postgres_data:/var/lib/postgresql/data
      - count_your_calories_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
  pgadmin:
      image: dpage/pgadmin4
      container_name: pgadmin4_container
      restart: always
      ports:
        - "8888:80"
      environment:
        PGADMIN_DEFAULT_EMAIL: test@gmail.com
        PGADMIN_DEFAULT_PASSWORD: test


      volumes:
        - count_your_calories_pgadmin_data:/var/lib/pgadmin