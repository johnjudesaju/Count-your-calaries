{%include "layout/partials/admin/header.html" %}
<div class="card">
    <div class="card-body">
        <h5 class="card-title fw-semibold mb-4">Smoothie</h5>
        <div class="card">
            <div class="card-body">
                <form action="{% url 'app_core:smoothie_upd' s_upd.id%}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Name</label>
                        <input type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                            name="name" value="{{s_upd.name}}">
                        <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                    </div>
                    <div class="mb-3">
    <label class="form-label">Ingredients</label>

    {% for ing in ingredients %}
        <div class="form-check">
            <input
                class="form-check-input"
                type="checkbox"
                name="ing[]"
                value="{{ ing.id }}"
                id="ing{{ ing.id }}"
                {% if ing in s_upd.ingredients.all %}checked{% endif %}
            >
            <label class="form-check-label" for="ing{{ ing.id }}">
                {{ ing.name }}
            </label>
        </div>
    {% endfor %}
</div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Availability</label>
                        <select class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp"
                            name="avai">
                        <option>----select Availability-----</option>
                        <option value="yes" {% if s_upd.availability == 'yes' %} selected {% endif %}>yes</option>
                        <option value="no" {% if s_upd.availability == 'no' %} selected {% endif %}>no</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Image</label>
                         <img src="/media/{{s_upd.simg}}" style="width : 100px;height: 100px;">
                        <input type="file" class="form-control" id="exampleInputPassword1" name="cimg" value="{{s_upd.simg}}">
                        <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                    </div>
                    <!-- <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">image</label>
                        <img src="/media/{{v.img}}" style="width : 100px;height: 100px;">

                    </div> -->
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
