{% load static %}
{% include "layout/partials/admin/header.html" %}
<div class="row">
    {% for i in card_val %}
    <div class="col-sm-6 col-xl-3">
        <div class="card overflow-hidden">
            <div class="position-relative">
                <a href="javascript:void(0)"><img src="/media/{{i.img}}" style="width : 600px;height: 600px;"
                        class="card-img-top rounded-0" alt="..."></a>
                <a href="javascript:void(0)"
                    class="bg-primary rounded-circle p-2 text-white d-inline-flex position-absolute bottom-0 end-0 mb-n3 me-3"
                    data-bs-toggle="tooltip" data-bs-placement="top" data-bs-title="Add To Cart"><i
                        class="ti ti-basket fs-4"></i></a>
            </div>
            <div class="card-body pt-3 p-4">
                <h6 class="fw-semibold fs-4">{{i.name}}</h6>
                <div class="d-flex align-items-center justify-content-between">
                    <h6 class="fw-semibold fs-4 mb-0">{{i.desc}} <span
                            class="ms-2 fw-normal text-muted fs-3"><del>$65</del></span></h6>
                    <ul class="list-unstyled d-flex align-items-center mb-0">
                        <li><a class="me-1" href="javascript:void(0)"><i class="ti ti-star-filled text-warning"></i></a>
                        </li>
                        <li><a class="me-1" href="javascript:void(0)"><i class="ti ti-star-filled text-warning"></i></a>
                        </li>
                        <li><a class="me-1" href="javascript:void(0)"><i class="ti ti-star-filled text-warning"></i></a>
                        </li>
                        <li><a class="me-1" href="javascript:void(0)"><i class="ti ti-star text-warning"></i></a></li>
                        <li><a class="" href="javascript:void(0)"><i class="ti ti-star text-warning"></i></a></li>
                    </ul>
                </div>
            </div>
        </div> ̰
    </div>
