<script>
  
document.addEventListener("DOMContentLoaded", function() {

    document.querySelectorAll(".btn-number").forEach(button => {
        button.addEventListener("click", function() {

            let type = this.getAttribute("data-type");//minus/plus
            let container = this.closest(".product-item");//div

            let qtyInput = container.querySelector(".input-number");//quantity
            let priceDisplay = container.querySelector(".price");
            let priceInput = container.querySelector("input[name='price']");

            let quantity = parseInt(qtyInput.value);
            let unitPrice = parseFloat(priceDisplay.getAttribute("data-price"));

            if (type === "plus") {
                quantity += 1;
            } else if (type === "minus" && quantity > 1) {
                quantity -= 1;
            }

            qtyInput.value = quantity;

            let total = quantity * unitPrice;

            // Update visible price
            priceDisplay.innerText = total;

            // Update form price input (very important)
            //priceInput.value = total;
        });
    });

});
</script> 

<!-- cart details -->
<script>
document.addEventListener("DOMContentLoaded", function() {

    function updateCart() {
        let grandTotal = 0;

        document.querySelectorAll(".cart-item").forEach(item => {
            let unitPrice = parseFloat(item.dataset.price);
            let qtyInput = item.querySelector(".input-number");
            let quantity = parseInt(qtyInput.value);

            let itemTotal = unitPrice * quantity;

            item.querySelector(".item-total").innerText = itemTotal.toFixed(2);

            grandTotal += itemTotal;
        });
      
        document.getElementById("cart-total").innerText = grandTotal.toFixed(2);
    }

    function updateCartTotal(){

    let grandTotal = 0;

    document.querySelectorAll(".item-total").forEach(item => {

        let price = parseFloat(item.innerText);

        grandTotal += price;

    });

    document.getElementById("cart-total").innerText = grandTotal.toFixed(2);

}

    document.querySelectorAll(".btn-number").forEach(button => {
        button.addEventListener("click", function() {

            let item = this.closest(".cart-item");
            let qtyInput = item.querySelector(".input-number");
            let quantity = parseInt(qtyInput.value);

            if (this.dataset.type === "plus") {
                quantity++;
            } else if (this.dataset.type === "minus" && quantity > 1) {
                quantity--;
            }

            qtyInput.value = quantity;

            updateCart();

        });
    });

});
</script> 

<script>
document.addEventListener("DOMContentLoaded", function(){

    function updateGrandTotal(){
        let grandTotal = 0;

        document.querySelectorAll(".item-total").forEach(item => {
            grandTotal += parseFloat(item.innerText);
        });

        document.getElementById("cart-total").innerText = grandTotal.toFixed(2);
    }

    function updateCartCount(){
        let count = document.querySelectorAll(".cart-item").length;
        document.getElementById("cart-count").innerText = count;
    }

    document.querySelectorAll(".remove-item").forEach(button => {
        button.addEventListener("click", function () {

            let cartItem = this.closest(".cart-item");
            let cartId = cartItem.dataset.id;

            fetch("{% url 'app_core:remove_cart' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    cart_id: cartId
                })
            })
            .then(response => response.json())
            .then(data => {

                if (data.status === "success") {

                    cartItem.remove();      // remove item
                    updateGrandTotal();     // update price
                    updateCartCount();      // update cart badge

                }

            });

        });
    });

});
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {

    const categorySelect = document.getElementById("category");
    // alert(categorySelect)

    if (categorySelect) {
      // alert("this works")

        categorySelect.addEventListener("change", function() {
  // alert("hii")


            let category = this.value;

            console.log("Selected:", category);  // 🔍 Debug check

            if (category === "") {
                window.location.href = "/core/cust_smoothie/";
                return;
            }

            fetch(`/core/cust_smoothie/${category}/`, {
                headers: {
                    "X-Requested-With": "XMLHttpRequest"
                }
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("product-container").innerHTML = data.html;
            })
            .catch(error => console.error("Error:", error));

        });

    }
    else{
      alert("hellooo")
    }

});
</script>

<script>
document.querySelectorAll(".btn-number").forEach(button => {

    button.addEventListener("click", function(){

        let input = this.closest(".product-qty").querySelector(".input-number");
        let id = input.dataset.id;

        let quantity = parseInt(input.value);

        if(this.dataset.type === "plus"){
            quantity++;
        }
        else if(this.dataset.type === "minus" && quantity > 1){
            quantity--;
        }

        input.value = quantity;

        // price update
        let priceElement = document.getElementById("price-" + id);
        let unitPrice = parseFloat(priceElement.dataset.price);

        let totalPrice = unitPrice * quantity;
        priceElement.innerText = totalPrice.toFixed(2);

        document.getElementById("amount-" + id).value = totalPrice;

        // calorie update
        let calorieElement = document.getElementById("calorie-" + id);
        let unitCalorie = parseFloat(calorieElement.dataset.calorie);

        let totalCalorie = unitCalorie * quantity;

        calorieElement.innerText = totalCalorie + " kcal";

    });

});
</script>
